# wardrobe: oa-wardrobe
# costume: duck
# note: non crea le user_dirs
---
name: duck

# Declarative desktop configuration (requires penguins-tailor devel).
desktop: cinnamon
display_manager: lightdm
session_type: x11
init: auto
autologin: true
login_background: /usr/share/backgrounds/duck/6819323284_e1ee501d4e_b.jpg
description: desktop cinnamon plus all that we need to enjoy at home and office
author: artisan
release: 2.0.1
distributions:
  - trixie
  - excalibur
  - resolute
  
sequence:
  repositories:
    sources_list:
      - main
      # contrib
      # non-free
      # non-free-firmware
    update: true
    upgrade: true
  packages:
    - cinnamon-desktop-environment
    - firefox-esr
    - lightdm
    - lightdm-gtk-greeter
    - spice-vdagent
  accessories:
    - base
    - graphics
    - multimedia
    - office
    # liquorix
    - firmwares
finalize:
  customize: true
  cmds:
    - ../../scripts/config_desktop_link.sh
    - ../../scripts/hostname.sh
reboot: true
