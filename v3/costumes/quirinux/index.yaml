name: quirinux

# Declarative desktop configuration (requires penguins-tailor devel).
desktop: xfce
display_manager: lightdm
session_type: x11
init: auto
autologin: true
description: Quirinux Animation Distro (only for Devuan Daedalus and Debian Bookworm)
author: charliemartinez
release: 2.5
branding: quirinux

distributions:
  - daedalus
  - bookworm

sequence:
  repositories:
    sources_list:
      - main
      - contrib
      - non-free
      - non-free-firmware
    sources_list_d:
      - export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      - apt-get install -y curl gnupg unzip
      - update-alternatives --install /usr/bin/pager pager /bin/cat 200 || true
      - rm -f /usr/share/keyrings/quirinux.gpg
      - curl -fsSL https://repo.quirinux.org/gpg/quirinux.asc | gpg --dearmor -o /usr/share/keyrings/quirinux.gpg
      - echo "deb [arch=amd64 signed-by=/usr/share/keyrings/quirinux.gpg] https://repo.quirinux.org/ quirinux2 main" | tee /etc/apt/sources.list.d/quirinux.list > /dev/null
      - curl -fsSL https://repo.quirinux.org/gpg/quirinux.asc | gpg --dearmor -o /etc/apt/trusted.gpg.d/quirinux.gpg    
    update: true
    upgrade: true

  accessories:
  - ./accessories/quirinux-base
  - ./accessories/quirinux-desktop
  - ./accessories/quirinux-firmware
  - ./accessories/quirinux-multimedia
  - ./accessories/quirinux-audio
  - ./accessories/quirinux-graphics
  - ./accessories/quirinux-animation
  - ./accessories/quirinux-office
  - ./accessories/quirinux-development
  - ./accessories/quirinux-utils
  - ./accessories/quirinux-drivers
  - ./accessories/quirinux-python
  - ./accessories/quirinux-devtools
  - ./accessories/quirinux-kde-libs
  - ./accessories/quirinux-gnome-libs
  - ./accessories/quirinux-printing
  - ./accessories/quirinux-vpn
  - ./accessories/quirinux-filesystem
  - ./accessories/quirinux-native
  - ./accessories/quirinux-i18n
  - ./accessories/quirinux-themes
  - ./accessories/quirinux-xfce
  - ./accessories/quirinux-fonts
  - ./accessories/quirinux-libs
  - ./accessories/quirinux-audio-data
  - ./accessories/quirinux-multimedia-codecs
  - ./accessories/quirinux-archive
  - ./accessories/quirinux-power
  - ./accessories/quirinux-gtk-engines
  - ./accessories/quirinux-system-monitoring
  - ./accessories/quirinux-firewall
  - ./accessories/quirinux-network-tools
  - ./accessories/quirinux-flatpak
  - ./accessories/quirinux-tcl-tk
  - ./accessories/quirinux-mono
  - ./accessories/quirinux-gnustep
  - ./accessories/quirinux-gambas
  - ./accessories/quirinux-nodejs
  - ./accessories/quirinux-xorg-input
  - ./accessories/quirinux-firefox-l10n
  - ./accessories/quirinux-thumbnailers
  - ./accessories/quirinux-opencl
  - ./accessories/quirinux-graphics-libs
  - ./accessories/quirinux-boot

finalize:
  customize: true
  cmds:
  # 1. Configuración y reparaciones
  - DEBIAN_FRONTEND=readline PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" dpkg --configure -a || true
  - apt-get install -y --allow-downgrades --fix-broken || true
  
  # 2. Instalaciones específicas
  - apt-get install -y quirinux-firmware quirinux-youdown quirinux-youtubedown || true
  
  # 3. Evitar paquetes no deseados (Recomendados)
  - echo 'APT::Install-Recommends "0";' > /etc/apt/apt.conf.d/99no-recommends
  - apt-get remove --purge -y kdeconnect 2>/dev/null || true
  
  # 4. Configuración de locales
  - locale-gen es_ES.UTF-8 pt_BR.UTF-8 pt_PT.UTF-8 hu_HU.UTF-8 gl_ES.UTF-8 de_DE.UTF-8 ru_RU.UTF-8 fr_FR.UTF-8 it_IT.UTF-8 || true
  
  # 5. Configuración de Debconf y Scripts de Quirinux
  - echo "debconf debconf/frontend select Dialog" | /usr/bin/debconf-set-selections
  - echo "debconf debconf/priority select high" | /usr/bin/debconf-set-selections
  - /usr/local/bin/quirinux-apply-skel || true
  - /usr/local/bin/quirinux-firmware-notice || true
  - /usr/local/bin/quirinux-kernel-notice || true
  - update-alternatives --remove pager /bin/cat || true
  - "../../scripts/hostname.sh"

  # 6. Limpieza segura
  - apt-get autoremove -y || true
  - apt-get clean || true

  # 7. Garantía de paquetes esenciales de Quirinux
  - apt-get install -y --reinstall mintinstall mint-common || true
  - apt-mark manual mintinstall mint-common || true

reboot: true
