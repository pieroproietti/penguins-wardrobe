#
# eggs: grub.main.cfg
#

# En UEFI se usa siempre el menu de texto: gfxterm deja la pantalla en negro
# con un cursor en parte del firmware (Mac antiguos con UGA y algunos PC), y
# el menu de texto no depende del video del firmware. En BIOS se mantiene
# gfxterm con el tema.
set quirinux_gfx=1
if [ "$grub_platform" = "efi" ]; then
  set quirinux_gfx=0
fi

if [ "$quirinux_gfx" = "1" ]; then
  if loadfont $prefix/font.pf2 ; then
    set gfxmode=1024x768x32
    insmod efi_gop
    insmod efi_uga
    insmod video_bochs
    insmod video_cirrus
    insmod gfxterm
    insmod jpeg
    insmod png
    terminal_output gfxterm
  fi

  set theme=/boot/grub/theme.cfg
fi

menuentry "{{{fullname}}} (Usar y/o instalar)" {
    set gfxpayload=keep
    {{{rmModules}}}
    linux {{{vmlinuz}}} {{{kernel_parameters}}} auto noprompt priority=critical mitigations=off amd_pstate.enable=0 intel_pstate=disable loglevel=0 nowatchdog elevator=noop slab_nomerge init_on_alloc=1 init_on_free=1 page_alloc.shuffle=1 pti=on vsyscall=none oops=panic module.sig_enforce=1 lockdown=confidentiality mce=0 loglevel=0 fsck.mode=skip quiet splash
    initrd {{{initrdImg}}}
}


menuentry 'Iniciar desde el equipo' {
    exit
}
