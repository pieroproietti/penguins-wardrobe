---
# Quirinux GNU/Linux - Calamares users configuration
# No password strength requirements: Quirinux targets low-resource
# hardware and non-technical users; any password is accepted.

defaultGroups:
  - cdrom
  - audio
  - video
  - plugdev
  - netdev
  - lpadmin
  - scanner
  - bluetooth

sudoersGroup: sudo
sudoersConfigureWithGroup: false

allowWeakPasswords: false
allowWeakPasswordsDefault: true

user:
  shell: /bin/bash
  forbidden_names: [ root, nobody ]
  home_permissions: "0700"

hostname:
  location: EtcFile
  writeHostsFile: true
  template: "quirinux-${product}"
  
