    - whiptail

  accessories:
    - quirinux-desktop
    #- quirinux-firmware
    #- quirinux-utils
    #- quirinux-multimedia
    #- quirinux-audio
    #- quirinux-graphics
    #- quirinux-animation
    #- quirinux-office
