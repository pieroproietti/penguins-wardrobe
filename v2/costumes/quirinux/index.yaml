name: quirinux
description: Quirinux Animation Distro (compatible with Devuan Daedalus and Debian Bookworm)
author: charliemartinez
release: 2.5

distributions:
  - daedalus
  - bookworm

sequence:
  repositories:
    sources_list:
      - main
      - contrib
      - non-free
      - non-free-firmware
    sources_list_d:
      - export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      
      # 1. Inyección temprana de selecciones debconf para gestores de pantalla
      - echo "slim shared/default-x-display-manager select lightdm" | debconf-set-selections
      - echo "lightdm shared/default-x-display-manager select lightdm" | debconf-set-selections
      - echo "gdm3 shared/default-x-display-manager select lightdm" | debconf-set-selections
      - echo "sddm shared/default-x-display-manager select lightdm" | debconf-set-selections
      
      # 2. Actualizar caché e instalar lightdm explícitamente ANTES que los accesorios
      - apt-get update
      - DEBIAN_FRONTEND=noninteractive apt-get install -y lightdm
      
      # 3. Configuración del repositorio de Quirinux
      - apt-get install -y curl gnupg unzip
      - update-alternatives --install /usr/bin/pager pager /bin/cat 200 || true
      - rm -f /usr/share/keyrings/quirinux.gpg
      - curl -fsSL https://repo.quirinux.org/gpg/quirinux.asc | gpg --dearmor -o /usr/share/keyrings/quirinux.gpg
      - echo "deb [arch=amd64 signed-by=/usr/share/keyrings/quirinux.gpg] https://repo.quirinux.org/ quirinux main" | tee /etc/apt/sources.list.d/quirinux.list > /dev/null
    update: true
    upgrade: true

  accessories:
  - quirinux/quirinux-base
  - quirinux/quirinux-desktop
  - quirinux/quirinux-firmware
  - quirinux/quirinux-multimedia
  - quirinux/quirinux-audio
  - quirinux/quirinux-graphics
  - quirinux/quirinux-animation
  - quirinux/quirinux-office
  - quirinux/quirinux-development
  - quirinux/quirinux-utils
  - quirinux/quirinux-drivers
  - quirinux/quirinux-python
  - quirinux/quirinux-devtools
  - quirinux/quirinux-kde-libs
  - quirinux/quirinux-gnome-libs
  - quirinux/quirinux-printing
  - quirinux/quirinux-vpn
  - quirinux/quirinux-filesystem
  - quirinux/quirinux-native
  - quirinux/quirinux-i18n
  - quirinux/quirinux-themes
  - quirinux/quirinux-xfce
  - quirinux/quirinux-fonts
  - quirinux/quirinux-libs
  - quirinux/quirinux-audio-data
  - quirinux/quirinux-multimedia-codecs
  - quirinux/quirinux-archive
  - quirinux/quirinux-power
  - quirinux/quirinux-gtk-engines
  - quirinux/quirinux-system-monitoring
  - quirinux/quirinux-firewall
  - quirinux/quirinux-network-tools
  - quirinux/quirinux-flatpak
  - quirinux/quirinux-tcl-tk
  - quirinux/quirinux-mono
  - quirinux/quirinux-gnustep
  - quirinux/quirinux-gambas
  - quirinux/quirinux-nodejs
  - quirinux/quirinux-xorg-input
  - quirinux/quirinux-firefox-l10n
  - quirinux/quirinux-thumbnailers
  - quirinux/quirinux-opencl
  - quirinux/quirinux-graphics-libs
  - quirinux/quirinux-boot

finalize:
  customize: true
  cmds:
  - DEBIAN_FRONTEND=readline PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" apt-get autoremove -y || true
  - dpkg --configure -a || true
  - apt-get remove -y broadcom-sta-dkms || true
  - apt-get install -y --allow-downgrades --fix-broken || true
  - apt-get install -y quirinux-firmware quirinux-youdown quirinux-youtubedown || true
  - echo "/usr/sbin/lightdm" > /etc/X11/default-display-manager
  - (command -v systemctl >/dev/null 2>&1 && systemctl disable slim.service 2>/dev/null && systemctl mask slim.service 2>/dev/null) || (insserv -r slim 2>/dev/null || update-rc.d slim disable 2>/dev/null) || true
  - for dm in slim gdm3 gdm sddm; do if command -v systemctl >/dev/null 2>&1; then systemctl disable "$dm.service" 2>/dev/null || true; systemctl mask "$dm.service" 2>/dev/null || true; else [ -f "/etc/init.d/$dm" ] && update-rc.d -f "$dm" remove 2>/dev/null || true; fi; done
  - if command -v systemctl >/dev/null 2>&1; then systemctl set-default graphical.target 2>/dev/null || true; systemctl enable lightdm.service 2>/dev/null || true; [ -d /lib/systemd/system ] && [ -f /lib/systemd/system/lightdm.service ] && ln -sf /lib/systemd/system/lightdm.service /etc/systemd/system/display-manager.service; else update-rc.d lightdm defaults 2>/dev/null || insserv lightdm 2>/dev/null || true; update-rc.d lightdm enable 2>/dev/null || true; fi
  - echo "debconf debconf/frontend select Dialog" | /usr/bin/debconf-set-selections
  - echo "debconf debconf/priority select high" | /usr/bin/debconf-set-selections
  - /usr/local/bin/quirinux-apply-skel || true
  - /usr/local/bin/quirinux-firmware-notice || true
  - /usr/local/bin/quirinux-kernel-notice || true
  - update-alternatives --remove pager /bin/cat || true
reboot: true
