name: quirinux
description: Quirinux Animation Distro (compatible with Devuan Daedalus and Debian Bookworm)
author: charliemartinez
release: 2.5

# packages_manifest: packages-full.list
# packages_install_file: packages-full.list
# packages_remove_file: packages_remove.txt

distributions:
  - daedalus
  - bookworm
  - trixie

sequence:
  repositories:
    sources_list:
      - main
      - contrib
      - non-free
      - non-free-firmware
    sources_list_d:
      - export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      - apt-get install -y curl gnupg unzip
      - rm -f /usr/share/keyrings/quirinux.gpg
      - curl -fsSL https://repo.quirinux.org/gpg/quirinux.asc | gpg --dearmor -o /usr/share/keyrings/quirinux.gpg
      - echo "deb [arch=amd64 signed-by=/usr/share/keyrings/quirinux.gpg] https://repo.quirinux.org/ quirinux main" | tee /etc/apt/sources.list.d/quirinux.list > /dev/null
    update: true
    upgrade: true

  # ho messo quirinux-base
  packages:
    - adduser
    - apt
    - apt-config-icons
    - aptdaemon
    - aptdaemon-data
    - apt-listchanges
    - apt-utils
    - base-files
    - base-passwd
    - bash
    - bash-completion
    - bzip2
    - ca-certificates
    - console-setup
    - console-setup-linux
    - coreutils
    - cron
    - cron-daemon-common
    - curl
    - dbus
    - dbus-bin
    - dbus-daemon
    - dbus-session-bus-common
    - dbus-system-bus-common
    - dbus-x11
    - debconf
    - debconf-i18n
    - debhelper
    - debianutils
    - dh-autoreconf
    - dh-strip-nondeterminism
    - dialog
    - dictionaries-common
    - diffutils
    - distro-info-data
    - dosfstools
    - dpkg
    - dpkg-dev
    - e2fsprogs
    - file
