# Quirinux: permite usar VirtualBox con kernels >= 6.12.
#
# Desde Linux 6.12, el modulo kvm activa VMX/SVM en cuanto se carga
# (enable_virt_at_load=1). Aunque no haya ninguna maquina KVM en marcha,
# VirtualBox falla con VERR_VMX_IN_VMX_ROOT_MODE (Intel) o VERR_SVM_IN_USE
# (AMD). Con 0, KVM solo reclama la virtualizacion cuando arranca una
# maquina KVM (QEMU, libvirt...), y VirtualBox funciona el resto del tiempo.
# En kernels anteriores el parametro no existe y se ignora.
options kvm enable_virt_at_load=0
