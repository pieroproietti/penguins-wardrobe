# quirinux2
---
name: quirinux2
description: Animation distro, Debian Bookworm/Devuan Daedalus only.
author: charliemartinez
release: 2.2
# Complete, authoritative package set (dpkg -l snapshot from a correct
# reference machine). After the regular install/remove steps below run,
# coa reconciles the system against this file: anything missing gets
# installed, and anything installed that is NOT in this list gets purged
# (protected essentials excepted).
packages_manifest: packages.list
# Precomputed list of packages to remove (base distro packages absent
# from the vendor manifest). Generated by comparing Devuan Desktop
# package list against Quirinux package list.
packages_install_file: quirinux_daedalus-packages.list
packages_interactive:
  - firmware-ipw2x00
  - firmware-ivtv
  - firmware-b43-installer
  - firmware-b43legacy-installer
  - b43-fwcutter
packages_remove_file: packages_remove.txt
distributions:
  - bookworm
  - daedalus
sequence:
  repositories:
    sources_list:
      - main
      - contrib
      - non-free
      - non-free-firmware
    sources_list_d:
    update: true
    upgrade: true
finalize:
  customize: true
  cmds:
    - export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      - apt-get install -y debconf-utils
      - update-alternatives --install /usr/bin/pager pager /bin/cat 200 || true
      - |
        cat <<EOF | debconf-set-selections
        lightdm shared/default-x-display-manager select lightdm
        slim shared/default-x-display-manager select lightdm
        firmware-ipw2x00 firmware/ipw2x00/license/accepted boolean true
        firmware-ipw2x00 firmware/ipw2x00/license/type select accept
        firmware-ivtv firmware/ivtv/license/accepted boolean true
        firmware-b43-installer firmware/b43/license/accepted boolean true
        firmware-b43legacy-installer firmware/b43legacy/license/accepted boolean true
        b43-fwcutter firmware/b43/install_non_free boolean true
        libpaper libpaper/defaultpaper select a4
        ca-certificates ca-certificates/trust_new_crts select yes
        console-setup console-setup/charmap47 select UTF-8
        keyboard-configuration keyboard-configuration/layoutcode string es
        ufw ufw/enable select true
        cups cups/raw-print boolean true
        cups cups/backends multiselect lpd, socket, usb, snmp, dnssd
        dictionaries-common dictionaries-common/default-ispell select castellano8 (Spanish 8 bit)
        dictionaries-common dictionaries-common/default-wordlist select castellano (Spanish)
        EOF
      - insserv -r slim || update-rc.d slim disable || true
      - /usr/bin/wget --no-check-certificate -O /tmp/quirinux-keyring.deb https://repo.quirinux.org/pool/main/q/quirinux-keyring/quirinux-keyring_1.0.6+q2_all.deb
      - PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" /usr/bin/dpkg -i /tmp/quirinux-keyring.deb || true
      - rm -f /tmp/quirinux-keyring.deb
      - /usr/bin/wget --no-check-certificate -O /tmp/quirinux-repo.deb https://repo.quirinux.org/pool/main/q/quirinux-repo/quirinux-repo_1.2.3+q2_all.deb
      - PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" /usr/bin/dpkg -i /tmp/quirinux-repo.deb
      - rm -f /tmp/quirinux-repo.deb
    
    - DEBIAN_FRONTEND=readline PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" apt-get autoremove -y || true
    - dpkg --configure -a || true
    - echo "/usr/sbin/lightdm" > /etc/X11/default-display-manager
    - for dm in slim gdm3 gdm sddm; do [ -f "/etc/init.d/$dm" ] && update-rc.d -f "$dm" remove >/dev/null 2>&1; done; true
    - update-rc.d lightdm defaults >/dev/null 2>&1 || insserv lightdm || true
    - update-rc.d lightdm enable >/dev/null 2>&1 || true
    - deb-systemd-helper enable lightdm.service >/dev/null 2>&1 || true
    - if [ -d /lib/systemd/system ] && [ -f /lib/systemd/system/lightdm.service ]; then ln -sf /lib/systemd/system/lightdm.service /etc/systemd/system/display-manager.service; fi
    - if [ -d /lib/systemd/system ] && [ -f /lib/systemd/system/graphical.target ]; then ln -sf /lib/systemd/system/graphical.target /etc/systemd/system/default.target; fi
    - if command -v systemctl >/dev/null 2>&1 && systemctl list-unit-files 2>/dev/null | grep -q '^lightdm\.service'; then systemctl set-default graphical.target >/dev/null 2>&1; systemctl enable lightdm.service >/dev/null 2>&1; fi
    - echo "debconf debconf/frontend select Dialog" | /usr/bin/debconf-set-selections
    - echo "debconf debconf/priority select high" | /usr/bin/debconf-set-selections
    - /usr/local/bin/quirinux-apply-skel || true
    - /usr/local/bin/quirinux-firmware-notice || true
    - /usr/local/bin/quirinux-kernel-notice || true
    - update-alternatives --remove pager /bin/cat || true
reboot: true
